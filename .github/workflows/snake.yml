name: Generate Snake Animation

on:
  schedule:
    # Atualiza a cobrinha todos os dias à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar o script manualmente na aba Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para o bot salvar a imagem na branch output
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar a animação da cobrinha (Snake) em tons de azul
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MateusHoffman
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#005bcf&color_dots=#ebedf0,#c0dcff,#72b1ff,#2486ff,#005bcf
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#429aff&color_dots=#161b22,#00326b,#0050a9,#006de7,#429aff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar imagens para a branch 'output'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
