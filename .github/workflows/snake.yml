name: Generate Snake Animation

on:
  schedule:
    # Atualiza a cobrinha todos os dias à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar o script manualmente na aba Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para o bot salvar a imagem na branch output
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar a animação da cobrinha (Snake) em tons de laranja
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MateusHoffman
          outputs: |
            # MODO CLARO: Cobra Azul, Quadrados Laranja (máximo vibrante)
            dist/github-contribution-grid-snake.svg?color_snake=#005bcf&color_dots=#ebedf0,#ffe0b2,#ffb74d,#ffa726,#f57c00
            # MODO ESCURO: Cobra Azul Clara, Quadrados Laranja Escuros (adaptados)
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#429aff&color_dots=#161b22,#5e3c0c,#9d6414,#c7801a,#ef9b1f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar imagens para a branch 'output'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
