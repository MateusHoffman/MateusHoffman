name: Generate Snake Animation

on:
  schedule:
    # Atualiza a cobrinha todos os dias à meia-noite (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar o script manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para o bot salvar a imagem na branch output
    
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar a animação da cobrinha (Snake)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MateusHoffman
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enviar imagens para a branch 'output'
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output # É daqui que o seu README puxa a imagem
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
